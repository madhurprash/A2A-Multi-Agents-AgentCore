      multi-agents/ops_orchestrator_agent/openAI_memory_tools.py, multi-agents/ops_orchestrator_agent/ops_remediation_agent.py,
      multi-agents/ops_orchestrator_agent/utils.py, multi-agents/retrieve_agent_card.py, streamlit_app.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:45:55Z'
    url: https://a2as.org/certified/agents/madhurprash/a2a-multi-agents-agentcore
  signatures:
    digest: sha256:NrlmHdyyeh0q-leYamO1Sn24HQfvDt_TMY6CZdhT2Wg
    key: ed25519:yipjxEIyyd2I8dwHlZisREE-t2c0Yt_lEpTVLVAI_OE
    sig: ed25519:XGmC6hv2ud9llEBlDIFKHeLSbNj03VFDQMj5R8dabIPPVpHWkDnmgT8q6_BzSAQ8f_xhg215ANBfabybRV5MCQ

agents:
  agent._create_agent:
    type: factory
    models: [get]
    tools: [send_message_to_agent]
    params:
      name: model_config.get(name)
      instruction: self._get_system_instruction
      description: Orchestrator agent that routes requests to specialized agents
      function: _create_agent
  agent.create_lead_orchestrator_agent:
    type: factory
    models: [get]
    tools: [web_search_impl]
    params:
      name: Ops_Orchestrator
      instructions: OPS_ORCHESTRATOR_AGENT_SYSTEM_PROMPT
      function: create_lead_orchestrator_agent
  monitoring_agent:
    type: instance
    models: [bedrock_model]
    tools: [gateway_tools]
    params:
      name: monitoring_agent
      description: A monitoring agent that handles CloudWatch logs, metrics, dashboards, and AWS service monitoring
      system_prompt: MONITORING_AGENT_SYSTEM_PROMPT
      hooks: hooks
      function: initialize_agent_and_server

models:
  bedrock_model:
    type: literal
    agents: [monitoring_agent]
  get:
    type: function
    agents: [agent._create_agent, agent.create_lead_orchestrator_agent]
    params:
      wrapper: get
      arg_0: id

tools:
  gateway_tools:
    type: function
    agents: [monitoring_agent]
    params:
      dynamic: "True"
  send_message_to_agent:
    type: function
    agents: [agent._create_agent]
    params:
      module: self.send_message_to_agent
      description: |-
        Send a message to a remote agent via A2A protocol.

        Args:
            agent_name: Name of the target agent
            task: Task description or question for the agent
            tool_context: Context from Google ADK

        Returns:
            List of response parts from the agent
  web_search_impl:
    type: function
    agents: [agent.create_lead_orchestrator_agent]
    params:
      description: Uses Tavily's search API to return top web results with snippets.

